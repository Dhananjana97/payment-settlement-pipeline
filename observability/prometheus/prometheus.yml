# Prometheus scrape config (docs/STEP9-PLAN.md D28).
#
# Replicas are discovered through Docker's embedded DNS: a compose service name resolves to one
# A record per running replica, so `docker compose up --scale consumer=6` is picked up on the next
# DNS refresh (5 s) with no Docker socket mounted into Prometheus.
global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: reader
    dns_sd_configs:
      - names: [reader]
        type: A
        port: 9100
        refresh_interval: 5s
    relabel_configs: &service_label
      - target_label: service
        replacement: ${1}
        source_labels: [job]

  - job_name: consumer
    dns_sd_configs:
      - names: [consumer]
        type: A
        port: 9100
        refresh_interval: 5s
    relabel_configs: *service_label

  - job_name: executor
    dns_sd_configs:
      - names: [executor]
        type: A
        port: 9100
        refresh_interval: 5s
    relabel_configs: *service_label

  - job_name: api
    dns_sd_configs:
      - names: [api]
        type: A
        port: 8080
        refresh_interval: 5s
    relabel_configs: *service_label

  # Redpanda's own broker metrics (partition leaders, under-replication, request latency).
  - job_name: redpanda
    metrics_path: /public_metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["redpanda:9644"]
    relabel_configs: *service_label

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
