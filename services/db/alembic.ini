# Alembic config. `script_location` and `sqlalchemy.url` are set programmatically by
# services.common.db.alembic_config() so one Settings object drives everything.
[alembic]
script_location = migrations
prepend_sys_path = ../..
sqlalchemy.url = postgresql+psycopg://ledger:ledger@localhost:5432/ledger

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
